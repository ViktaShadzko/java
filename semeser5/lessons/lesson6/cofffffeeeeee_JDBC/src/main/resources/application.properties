# Server Configuration
server.port=8080
spring.application.name=cofffffeeeeee

# Active Profile - Choose repository implementation:
# - json: JSON file-based repository
# - jdbc: Raw JDBC implementation (PreparedStatement)
# - jdbctemplate: Spring JdbcTemplate implementation
# - jdbcclient: Spring JdbcClient implementation
# - jdbccrud: Spring Data CrudRepository with adapter
spring.profiles.active=jdbccrud

# Logging Configuration
logging.level.ehu.java.cofffffeeeeee=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Initialization
spring.sql.init.mode=always

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

