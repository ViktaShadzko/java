version: '3.8'

services:
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui
    ports:
      - "8081:8080"
    environment:
      - SWAGGER_JSON=/openapi/open-api.yaml
      - BASE_URL=/
    volumes:
      - ./open-api.yaml:/openapi/open-api.yaml:ro
    restart: unless-stopped

